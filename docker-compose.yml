version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sopia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sopiapass}
      POSTGRES_DB: ${POSTGRES_DB:-sopia}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

