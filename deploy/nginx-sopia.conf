# SOPIA nginx configuration (Linux VM reverse proxy).
#
# Recommended layout: ONE domain serves the SPA and proxies /api/ to the API.
# Same-origin means the browser issues no cross-origin requests at all, so CORS
# cannot break the deployment. A frontend/API split-domain alternative is at the
# bottom if you prefer separate hostnames.
#
# Install:
#   sudo cp deploy/nginx-sopia.conf /etc/nginx/sites-available/sopia
#   sudo ln -s /etc/nginx/sites-available/sopia /etc/nginx/sites-enabled/sopia
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue a certificate:
#   sudo certbot --nginx -d sopia.example.com
#
# Replace every sopia.example.com and /var/www/sopia path below.

upstream sopia_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# --- HTTP: ACME challenge + redirect to HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sopia.example.com;

    # Certbot's HTTP-01 challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # `http2 on` requires nginx >= 1.25.1. On older builds use:
    #   listen 443 ssl http2;
    #   listen [::]:443 ssl http2;
    # and delete this line.
    http2 on;
    server_name sopia.example.com;

    # Managed by certbot; paths shown for a manual setup.
    ssl_certificate     /etc/letsencrypt/live/sopia.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sopia.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads are capped at MAX_UPLOAD_MB in the API; allow a little headroom so
    # nginx rejects oversized bodies before they reach the application.
    client_max_body_size 30m;

    # Security headers. The API sets its own CORS headers, so none are needed
    # here for the same-origin layout.
    add_header X-Content-Type-Options   nosniff always;
    add_header X-Frame-Options          SAMEORIGIN always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- SPA -----------------------------------------------------------------
    root /var/www/sopia;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Server-Sent Events (streaming chat) ---------------------------------
    # Must precede /api/ so it wins. Buffering would hold tokens back until the
    # response completes, which defeats streaming entirely.
    location = /api/v1/chat/stream {
        proxy_pass http://sopia_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # CPU-only generation can take a while; keep the stream open.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://sopia_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Document ingestion embeds every chunk and, on a CPU-only VM, a large
        # PDF can take tens of minutes. These timeouts keep such a request alive
        # instead of returning 504. See DEPLOYMENT.md - ingestion is still
        # synchronous, so a background worker is the real fix for big documents.
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Allow large uploads to stream straight through.
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://sopia_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # Readiness probe (not under /api/). Without this it would fall through to
    # the SPA and always answer 200, hiding database outages from the probe.
    location = /ready {
        proxy_pass http://sopia_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}

